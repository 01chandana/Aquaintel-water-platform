# CI/CD pipeline (Ch. 18, Listing 18.1): quality gates -> tests with real services -> images -> deploy.
name: AquaIntel CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # gitleaks scans the full history
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - run: pip install -r requirements/dev.txt
      - name: No secrets or databases tracked (QA audit AQ-029)
        working-directory: .
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.|\.(db|sqlite3?|dump|pem|key)$|^backend/var/|__pycache__/' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Tracked files that must not be in git:"; echo "$bad"; exit 1; fi
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Ruff
        run: ruff check app scripts tests
      - name: mypy
        run: mypy app
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements/prod.txt   # blocking: the tree is clean today

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: timescale/timescaledb:2.10.3-pg15
        env: { POSTGRES_DB: test_aquaintel, POSTGRES_USER: aquaintel, POSTGRES_PASSWORD: aquaintel }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aquaintel" --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 10
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        ports: ["9092:9092"]
        env:
          CLUSTER_ID: aquaintel-ci-kraft-0000001
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:29093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    env:
      AQUAINTEL_TEST_DATABASE_URL: postgresql+asyncpg://aquaintel:aquaintel@localhost:5432/test_aquaintel
      AQUAINTEL_REDIS_URL: redis://localhost:6379/0
      AQUAINTEL_TEST_KAFKA: localhost:9092
      AQUAINTEL_SECRET_KEY: ci-only-secret-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - run: pip install -r requirements/dev.txt
      - name: Migrations apply and roll back cleanly
        env: { AQUAINTEL_DATABASE_URL: postgresql+asyncpg://aquaintel:aquaintel@localhost:5432/test_aquaintel }
        run: alembic upgrade head && alembic downgrade base
      - name: Unit, integration and API tests (coverage gate 80%)
        run: pytest tests/ --cov=app --cov-report=xml --cov-fail-under=80 --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/coverage.xml
            backend/pytest.xml

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack with demo data
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=e2e-secret-key-0123456789abcdef0123/" .env
          # journeys sign in several accounts from one IP within a minute; the production limit is 5/min
          echo "AQUAINTEL_RATE_LIMIT_LOGIN_PER_MINUTE=60" >> .env
          docker compose -f docker-compose.yml --profile demo up -d --build
          docker compose -f docker-compose.yml wait seed          # one-shot: seeds history and trains models
          timeout 300 bash -c 'until curl -fsS http://localhost/health/ready; do sleep 5; done'
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Playwright journeys (Ch. 16.6)
        working-directory: frontend
        env: { E2E_BASE_URL: "http://localhost" }
        run: npm ci && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        run: docker compose logs --tail=200 api

  build-images:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    if: github.event_name == 'push'
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/aquaintel-${{ matrix.component }}:${{ github.sha }}
            ${{ env.REGISTRY }}/aquaintel-${{ matrix.component }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/aquaintel-${{ matrix.component }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-images, e2e]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Deploy (rolling update, no capacity loss)
        env: { KUBECONFIG_DATA: "${{ secrets.STAGING_KUBECONFIG }}" }
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig && export KUBECONFIG=$PWD/kubeconfig
          cd infra/kubernetes/base
          kustomize edit set image registry.example.com/aquaintel/api=${{ env.REGISTRY }}/aquaintel-backend:${{ github.sha }}
          kustomize edit set image registry.example.com/aquaintel/frontend=${{ env.REGISTRY }}/aquaintel-frontend:${{ github.sha }}
          kubectl apply -k .
          kubectl -n aquaintel rollout status deployment/api --timeout=5m
      - name: Smoke test
        run: curl -fsS https://staging.aquaintel.io/health/ready

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-images, e2e]
    if: github.ref == 'refs/heads/main'
    environment: production       # manual approval gate configured on the environment
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Deploy and roll back automatically on a failed rollout
        env: { KUBECONFIG_DATA: "${{ secrets.PRODUCTION_KUBECONFIG }}" }
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig && export KUBECONFIG=$PWD/kubeconfig
          cd infra/kubernetes/base
          kustomize edit set image registry.example.com/aquaintel/api=${{ env.REGISTRY }}/aquaintel-backend:${{ github.sha }}
          kustomize edit set image registry.example.com/aquaintel/frontend=${{ env.REGISTRY }}/aquaintel-frontend:${{ github.sha }}
          kubectl apply -k .
          kubectl -n aquaintel rollout status deployment/api --timeout=5m || (kubectl -n aquaintel rollout undo deployment/api && exit 1)
