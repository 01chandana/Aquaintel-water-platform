# QA audit AQ-004 / AQ-014. Everything the SPA loads is same-origin (fonts and charts are bundled).
# style-src needs 'unsafe-inline' because MUI (emotion) injects <style> tags at runtime; scripts do not.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
