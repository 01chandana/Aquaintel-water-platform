# Static SPA server inside the frontend container (the edge proxy in /nginx handles /v1 and /ws).
server {
  listen 3000;
  root /usr/share/nginx/html;
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  # hashed bundles never change: cache for a year; index.html is always revalidated.
  # (nginx drops server-level add_header in a location that sets its own, so the snippet is repeated)
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  # client-side routes (React Router) fall back to the app shell
  location / {
    try_files $uri $uri/ /index.html;
  }
}
