# Edge reverse proxy (Ch. 15.2): one origin for the SPA, the REST API and the dashboard WebSocket.
worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 10m;   # matches AQUAINTEL_MAX_REQUEST_BODY_MB

  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"upstream_rt":"$upstream_response_time","request_id":"$request_id"}';
  access_log /var/log/nginx/access.log json;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1024;

  # ingress-level limit (Ch. 15.5.1: 1000 req/s per IP); the API applies per-user limits on top
  limit_req_zone $binary_remote_addr zone=perip:20m rate=1000r/s;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream api      { server api:8000; keepalive 32; }
  upstream frontend { server frontend:3000; }

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /v1/ {
      limit_req zone=perip burst=2000 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;          # report generation can take a while
    }

    location /ws {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    location ~ ^/health(/live|/ready)?$ { proxy_pass http://api; }

    # Prometheus scrapes the API directly on the internal network; never expose metrics publicly
    location = /metrics { return 404; }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
    }
  }
}
