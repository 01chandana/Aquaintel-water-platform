[project]
name = "aquaintel-backend"
version = "1.0.0"
description = "AquaIntel Operations Platform - FastAPI backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL", "api: HTTP-level tests", "seeded: runs against the session-seeded plant database"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]
omit = ["app/db/migrations/*", "app/integration/mqtt_bridge.py", "app/integration/modbus_gateway.py",
        "app/integration/kafka_consumer.py", "app/workers/tasks/*", "app/workers/celery_app.py"]

[tool.coverage.report]
fail_under = 80
show_missing = false
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "ASYNC", "RUF"]
ignore = ["UP038", "E501", "S101", "S311", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "S608", "B904", "UP040", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true
exclude = ["app/db/migrations/"]
