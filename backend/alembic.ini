[alembic]
script_location = %(here)s/app/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s
version_path_separator = os
# sqlalchemy.url is injected from AQUAINTEL_DATABASE_URL in env.py (12-factor, Ch. 3.1.1)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
