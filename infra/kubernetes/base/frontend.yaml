apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aquaintel
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: aquaintel }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: aquaintel, tier: web }
    spec:
      containers:
        - name: frontend
          image: registry.example.com/aquaintel/frontend:latest
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aquaintel
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: aquaintel
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
