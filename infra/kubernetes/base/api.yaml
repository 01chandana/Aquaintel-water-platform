# API: 3 replicas, rolling update with no capacity loss, HPA on CPU > 70% (Ch. 15.4.2, Table 15.1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aquaintel
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: aquaintel }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: aquaintel, tier: app }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      initContainers:
        - name: migrate
          image: registry.example.com/aquaintel/api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: aquaintel-api-config }
            - secretRef: { name: aquaintel-api-secrets }
      containers:
        - name: api
          image: registry.example.com/aquaintel/api:latest
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: aquaintel-api-config }
            - secretRef: { name: aquaintel-api-secrets }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 3Gi }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false }
      terminationGracePeriodSeconds: 40
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aquaintel
spec:
  selector: { app.kubernetes.io/name: api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: aquaintel
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: aquaintel
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: api }
