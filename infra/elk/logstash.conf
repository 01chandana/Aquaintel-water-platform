# structlog writes one JSON object per line (Ch. 19.4.1); ship container logs with Filebeat to :5044
input  { beats { port => 5044 } }
filter {
  json { source => "message" skip_on_invalid_json => true }
  date { match => ["timestamp", "ISO8601"] }
}
output { elasticsearch { hosts => ["http://elasticsearch:9200"] index => "aquaintel-logs-%{+YYYY.MM.dd}" } }
